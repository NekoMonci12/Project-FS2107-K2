# Backend penyimpanan: sqlite (bawaan) atau mysql
storage.type=sqlite

# --- SQLite (bawaan) ---
storage.sqlite.driver=org.sqlite.JDBC
storage.sqlite.path=data/keuangan.db

# --- MySQL ---
storage.mysql.driver=com.mysql.cj.jdbc.Driver
storage.mysql.url=jdbc:mysql://localhost:3306/keuangan?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
storage.mysql.username=root
storage.mysql.password=
