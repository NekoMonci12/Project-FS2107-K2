name: Build Check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Check (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Maven (compile + package)
        run: mvn -B -ntp clean package
